  </text>

  <!-- Domain Footer -->
  <rect x="80" y="545" width="220" height="40" rx="8" fill="#ffffff" fill-opacity="0.15" />
  <text x="100" y="571" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">
